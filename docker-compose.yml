services:
  vector-db:
    image: pgvector/pgvector:pg16
    container_name: hoanphim_vector_db
    restart: always
    environment:
      POSTGRES_USER: ai_admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: ai_rag_db
    ports:
      - "5435:5432"
    volumes:
      - vector_db_data:/var/lib/postgresql/data

volumes:
  vector_db_data: